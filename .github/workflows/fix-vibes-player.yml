name: Fix Vibes playlist metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Vibes UI with YouTube playlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()

          old = """        function renderTrackMeta() {
              var t = tracks[trackIndex];
              if (!t) return;
              miniThumb.src = t.thumbnailUrl;
              miniThumb.alt = t.title;
              miniTitle.textContent = t.title;
              miniArtist.textContent = t.artist;
              expandedThumb.src = t.thumbnailUrl;
              expandedThumb.alt = t.title;
              expandedTitle.textContent = t.title;
              expandedArtist.textContent = t.artist + ' — YouTube';
          }
          """
          new = """        function renderTrackMeta() {
              var t = tracks[trackIndex];
              if (ytPlayer && typeof ytPlayer.getVideoData === 'function') {
                  var data = ytPlayer.getVideoData() || {};
                  if (data.video_id) {
                      var title = data.title || 'YouTube';
                      var author = data.author || 'YouTube';
                      var thumb = 'https://img.youtube.com/vi/' + data.video_id + '/hqdefault.jpg';
                      miniThumb.src = thumb;
                      miniThumb.alt = title;
                      miniTitle.textContent = title;
                      miniArtist.textContent = author;
                      expandedThumb.src = thumb;
                      expandedThumb.alt = title;
                      expandedTitle.textContent = title;
                      expandedArtist.textContent = author + ' — YouTube';
                      return;
                  }
              }
              if (!t) return;
              miniThumb.src = t.thumbnailUrl;
              miniThumb.alt = t.title;
              miniTitle.textContent = t.title;
              miniArtist.textContent = t.artist;
              expandedThumb.src = t.thumbnailUrl;
              expandedThumb.alt = t.title;
              expandedTitle.textContent = t.title;
              expandedArtist.textContent = t.artist + ' — YouTube';
          }
          """
          if old not in s:
              raise SystemExit('renderTrackMeta block not found')
          s = s.replace(old, new, 1)

          old2 = """            if (ytPlayer && typeof ytPlayer.loadPlaylist === 'function') {
                  ytPlayer.loadPlaylist({ listType: 'playlist', list: vibesPlaylistId, index: 0 });
              }
              ytPlayer.setVolume"""
          new2 = """            if (ytPlayer && typeof ytPlayer.loadPlaylist === 'function') {
                  ytPlayer.loadPlaylist({ listType: 'playlist', list: vibesPlaylistId, index: 0 });
                  setTimeout(renderTrackMeta, 800);
              }
              ytPlayer.setVolume"""
          if old2 not in s:
              raise SystemExit('onPlayerReady block not found')
          s = s.replace(old2, new2, 1)

          old3 = """        function onPlayerStateChange(e) {
              if (e.data === YT.PlayerState.PLAYING) {"""
          new3 = """        function onPlayerStateChange(e) {
              renderTrackMeta();
              if (e.data === YT.PlayerState.PLAYING) {"""
          if old3 not in s:
              raise SystemExit('onPlayerStateChange block not found')
          s = s.replace(old3, new3, 1)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Fix Vibes player to show current playlist track' || exit 0
          git push
