name: Fix Vibes YouTube playlist player

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch playlist player
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()

          s = s.replace("                videoId: undefined,\n", "")
          s = s.replace("                    fs: 0\n", "                    fs: 0,\n                    origin: window.location.origin\n")

          old = """            if (ytPlayer && typeof ytPlayer.cuePlaylist === 'function') {\n                ytPlayer.cuePlaylist({ listType: 'playlist', list: vibesPlaylistId, index: 0 });\n            }\n            syncYouTubeTrackMeta(0);\n"""
          new = """            if (ytPlayer && typeof ytPlayer.cuePlaylist === 'function') {\n                ytPlayer.cuePlaylist({ listType: 'playlist', list: vibesPlaylistId, index: 0 });\n                setTimeout(function () { syncYouTubeTrackMeta(0); }, 800);\n            }\n"""
          if old not in s:
              raise SystemExit('Expected onPlayerReady block was not found')
          s = s.replace(old, new, 1)

          old = """        function onPlayerStateChange(e) {\n            if (e.data === YT.PlayerState.PLAYING) {\n                syncYouTubeTrackMeta();\n                setPlayIcons(true);\n"""
          new = """        function onPlayerStateChange(e) {\n            if (e.data === 5) {\n                syncYouTubeTrackMeta(0);\n                return;\n            }\n            if (e.data === YT.PlayerState.PLAYING) {\n                syncYouTubeTrackMeta(0);\n                setPlayIcons(true);\n"""
          if old not in s:
              raise SystemExit('Expected state-change block was not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Fix Vibes playlist initialization and metadata' || exit 0
          git push
