name: Set Vibes YouTube playlist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap Vibes playlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()
          s = s.replace("        var isOpen = false;\n", "        var isOpen = false;\n        var vibesPlaylistId = 'PLNyNAs0WPlfU';\n")
          s = s.replace("                videoId: tracks[trackIndex].youtubeVideoId,\n                playerVars: {", "                videoId: undefined,\n                playerVars: {\n                    listType: 'playlist',\n                    list: vibesPlaylistId,")
          s = s.replace("        function onPlayerReady() {\n            isPlayerReady = true;", "        function onPlayerReady() {\n            isPlayerReady = true;\n            if (ytPlayer && typeof ytPlayer.loadPlaylist === 'function') {\n                ytPlayer.loadPlaylist({ listType: 'playlist', list: vibesPlaylistId, index: 0 });\n            }")
          s = s.replace("        function nextTrack() { loadTrack(trackIndex + 1, true); }\n        function prevTrack() { loadTrack(trackIndex - 1, true); }", "        function nextTrack() {\n            if (ytPlayer && isPlayerReady && typeof ytPlayer.nextVideo === 'function') {\n                ytPlayer.nextVideo();\n                return;\n            }\n            loadTrack(trackIndex + 1, true);\n        }\n        function prevTrack() {\n            if (ytPlayer && isPlayerReady && typeof ytPlayer.previousVideo === 'function') {\n                ytPlayer.previousVideo();\n                return;\n            }\n            loadTrack(trackIndex - 1, true);\n        }")
          s = s.replace("       Apple-Music-style YouTube player with REAL playback control\n       via the YouTube IFrame Player API.", "       Apple-Music-style YouTube playlist player with REAL playback control\n       via the YouTube IFrame Player API.")
          p.write_text(s)
          PY

          rm -f .github/workflows/set-vibes-playlist.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .github/workflows/set-vibes-playlist.yml
          git commit -m 'Swap Vibes to personal YouTube playlist' || exit 0
          git push
